name: Codex exact source native and quality
on:
  push:
    branches: [codex/urfave-native-final]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: [stable, oldstable]
        include:
          - os: ubuntu-24.04
            go: '1.22.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: support
      - name: Use identical source bytes on each host
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          ref: 9c76dcd12ecdc7d5542d7e522032a08fc6713674
          path: source
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Original and fixed same tests then full native race checks
        working-directory: source
        shell: bash
        run: bash "$GITHUB_WORKSPACE/support/.github/codex/native.sh"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.go }}
          path: ${{ runner.temp }}/evidence
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: support
      - uses: actions/checkout@v7
        with:
          ref: 9c76dcd12ecdc7d5542d7e522032a08fc6713674
          path: source
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Pinned quality tools and original baseline comparison
        working-directory: source
        shell: bash
        run: bash "$GITHUB_WORKSPACE/support/.github/codex/quality.sh"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality
          path: ${{ runner.temp }}/evidence
