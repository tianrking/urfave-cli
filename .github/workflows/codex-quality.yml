name: Codex exact source quality
on:
  push:
    branches: [codex/urfave-quality]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: support
      - uses: actions/checkout@v7
        with:
          ref: 9c76dcd12ecdc7d5542d7e522032a08fc6713674
          path: source
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Pinned quality tools and original baseline comparison
        working-directory: source
        shell: bash
        run: bash "$GITHUB_WORKSPACE/support/.github/codex/quality.sh"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality
          path: ${{ runner.temp }}/evidence
